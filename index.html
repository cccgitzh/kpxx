<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="format-detection" content="telephone=no" />
    <!-- 内部资料，不参与搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="公司开票与收款信息：公司名称、纳税人识别号、注册地址与电话、开户银行与账号、可开具发票类型及税率，含对公与对私收款账户。"
    />
    <title>开票与收款信息</title>

    <!-- 样式按职责拆分，便于单独维护；print.css 只在打印时解析 -->
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/print.css" media="print" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M12 9h8M12 14h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>

  <body>
    <div class="page">
      <header class="masthead">
        <p class="eyebrow">
          <span id="site-title">开票与收款信息</span>
          <span class="sep">·</span>INVOICE &amp; PAYMENT
          <span class="sep">·</span><span id="updated-at">2026-10</span>
        </p>
        <nav class="tabs" id="tabs" role="tablist" aria-label="开票主体切换"></nav>
      </header>

      <!-- 每家公司渲染为独立的 panel，切换时只显示其中一个 -->
      <main id="panels"></main>

      <!-- 模块加载失败时的兜底提示（正常情况不显示） -->
      <p class="empty" id="boot-hint" hidden>
        页面未加载成功。若你是直接双击打开本文件，请改用本地服务器访问
        （例如在项目目录执行 <code>python -m http.server 8088</code>），或确认浏览器支持 ES Module。
      </p>
    </div>

    <!-- 底部操作条 -->
    <div class="dock" role="group" aria-label="复制与导出">
      <button type="button" id="btn-text" class="is-primary">复制全文</button>
      <button type="button" id="btn-image">复制图片</button>
      <button type="button" id="btn-download">下载图片</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">已复制</div>

    <noscript>
      <div class="empty">请开启 JavaScript 以查看开票与收款信息。</div>
    </noscript>

    <!-- 数据文件保持为普通脚本：财务人员直接改这个文件即可，不必了解模块语法 -->
    <script src="assets/js/data.js"></script>
    <script type="module" src="assets/js/main.js"></script>

    <script>
      /* 兜底：模块未执行（file:// 或浏览器过旧）时不要留白屏 */
      window.addEventListener("load", function () {
        window.setTimeout(function () {
          var host = document.getElementById("panels");
          var hint = document.getElementById("boot-hint");
          if (host && hint && !host.children.length) hint.hidden = false;
        }, 800);
      });
    </script>
  </body>
</html>
